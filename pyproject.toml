[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam"
version = "0.1.0"
description = "Superposition of Turbulon and Eddy Atmospheric Model"
authors = [{name = "Thomas DeWitt"}]
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "netcdf4>=1.5",
    "numba>=0.57",
    "numpy",
    "scipy",
    "torch",
]

[tool.setuptools.packages.find]
include = ["steam*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
# calibration/ only: not needed to run the model, and deliberately
# not runtime dependencies of the steam package.
calibration = [
    "matplotlib",
    "scaleinvariance>=0.14",
]
