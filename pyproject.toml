[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam"
version = "0.1.0"
description = "Superposition of Turbulon and Eddy Atmospheric Model"
authors = [{name = "Thomas DeWitt"}]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
include = ["steam*"]
